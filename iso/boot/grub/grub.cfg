set timeout=5
set default=0

insmod all_video
insmod efi_gop
insmod efi_uga
insmod gfxterm
insmod png
insmod multiboot
insmod multiboot2

load_video
loadfont /boot/grub/fonts/unicode.pf2
set gfxfont=unicode
set gfxmode=1920x1080x32,1280x720x32,1280x720,1024x768x32,800x600x32,auto
set gfxpayload=keep
terminal_output gfxterm

menuentry "PlexOS 1.0 -- 720p HD (auto: GOP/VBE/Bochs)" {
    echo "PlexOS: carico kernel..."
    multiboot2 /boot/kernel.bin
    echo "PlexOS: avvio kernel..."
    boot
}

menuentry "PlexOS 1.0 -- Legacy VBE diretto (multiboot1)" {
    multiboot /boot/kernel.bin
    boot
}

menuentry "PlexOS 1.0 -- Serial debug (multiboot2)" {
    multiboot2 /boot/kernel.bin --serial
    boot
}
